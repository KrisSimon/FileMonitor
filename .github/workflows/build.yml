name: Build and Test

on:
  push:
    branches: [ main, release/*, feature/* ]
  pull_request:
    branches: [ main, release/* ]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Swift 6.2
      run: |
        wget -q https://download.swift.org/swift-6.2-release/xcode/swift-6.2-RELEASE/swift-6.2-RELEASE-osx.pkg
        sudo installer -pkg swift-6.2-RELEASE-osx.pkg -target /
        echo "/Library/Developer/Toolchains/swift-6.2-RELEASE.xctoolchain/usr/bin" >> $GITHUB_PATH
    - name: Build
      run: swift build
    - name: Run tests
      run: swift test

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Swift
        run: |
          wget -q https://download.swift.org/swift-6.2-release/ubuntu2404/swift-6.2-RELEASE/swift-6.2-RELEASE-ubuntu24.04.tar.gz
          tar xzf swift-6.2-RELEASE-ubuntu24.04.tar.gz
          echo "$PWD/swift-6.2-RELEASE-ubuntu24.04/usr/bin" >> $GITHUB_PATH
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v
        timeout-minutes: 10

  build-windows:
    runs-on: windows-latest
    # The "Windows hangs for 10 minutes producing nothing" symptom is
    # actually SPM issue #6592: `swift test` doesn't flush its stdout
    # when running into a pipe, which is what happens under any CI
    # runner. The test binary is running fine — its output is sitting
    # in a fully-buffered pipe until the binary exits, which never
    # happens before the job timeout.
    #
    # Workaround: `--xunit-output` writes test results directly to a
    # file as they happen, bypassing the stdout pipe. The
    # `--parallel` flag is required for the report to be emitted; an
    # SPM quirk noted in the docs for the flag. Per-test serialisation
    # comes from `.serialized` traits on each suite, not from this CLI
    # flag, so `--parallel` is safe here.
    continue-on-error: true   # safety net while we shake out the new flow
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.2"
      - name: Build (includes test compilation)
        run: swift build --build-tests -v
      # Diagnostic bisect. Earlier run (commit ffa9e4f) proved:
      #   - swift test --list-tests works on Windows
      #   - swift test --filter "initModule" produces clean xunit output
      #   - Full suite hangs to timeout
      # So one (or a few) specific tests hang. Top suspects: tests that wait
      # on AsyncStream events from FileMonitor — if WindowsWatcher doesn't
      # deliver any events through the stream, `for await` blocks forever
      # and even @Suite(.timeLimit) can't interrupt it (the suspended
      # continuation never gets a chance to be cancelled).
      #
      # Exclude the async-stream test and the Windows-specific watcher
      # tests; everything else should complete. If it does, we've localised
      # the hang. If not, repeat with a narrower filter.
      - name: List tests (discovery check)
        shell: pwsh
        run: swift test --list-tests
        timeout-minutes: 3
      - name: Run suite minus likely hangers
        shell: pwsh
        # `--skip` filters by test ID prefix. Drop:
        #   lifecycleChangeAsync — uses `for await monitor.stream`
        #   WindowsWatcherTests/* — direct WindowsWatcher.observe() probes
        run: |
          swift test --parallel `
            --skip "lifecycleChangeAsync" `
            --skip "WindowsWatcherTests" `
            --xunit-output bisect-tests.xml
        timeout-minutes: 8
      - name: Show xunit outputs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Filter "*tests*.xml" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "=== $($_.Name) ==="
            Get-Content $_.FullName
          }
      - name: Upload xunit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-tests-xml
          path: |
            *tests*.xml
          if-no-files-found: ignore
