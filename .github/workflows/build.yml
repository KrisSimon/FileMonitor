name: Build and Test

on:
  push:
    branches: [ main, release/*, feature/* ]
  pull_request:
    branches: [ main, release/* ]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Swift 6.2
      run: |
        wget -q https://download.swift.org/swift-6.2-release/xcode/swift-6.2-RELEASE/swift-6.2-RELEASE-osx.pkg
        sudo installer -pkg swift-6.2-RELEASE-osx.pkg -target /
        echo "/Library/Developer/Toolchains/swift-6.2-RELEASE.xctoolchain/usr/bin" >> $GITHUB_PATH
    - name: Build
      run: swift build
    - name: Run tests
      run: swift test

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Swift
        run: |
          wget -q https://download.swift.org/swift-6.2-release/ubuntu2404/swift-6.2-RELEASE/swift-6.2-RELEASE-ubuntu24.04.tar.gz
          tar xzf swift-6.2-RELEASE-ubuntu24.04.tar.gz
          echo "$PWD/swift-6.2-RELEASE-ubuntu24.04/usr/bin" >> $GITHUB_PATH
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v
        timeout-minutes: 10

  build-windows:
    runs-on: windows-latest
    # Per-test bisect (db6d3e2) proved every individual test passes on
    # Windows in 2–7 seconds. The full suite hangs only when run with
    # `swift test --parallel`. Conclusion: the hang is in the parallel
    # scheduler, not in any specific test. Cross-suite concurrent file
    # watchers race on Windows file-system resources.
    #
    # Fix: drop `--parallel`. Each @Suite already carries `.serialized`
    # so within-suite ordering is preserved; without --parallel, suites
    # themselves also run sequentially. Total runtime ~70 s.
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.2"
      - name: Build (includes test compilation)
        run: swift build --build-tests -v
      - name: Run tests (serial)
        shell: pwsh
        # No --parallel. --xunit-output writes results to file in case
        # SPM's stdout-to-pipe flushing still bites on Windows (SPM
        # #6592). Up the timeout to 5 min — gives 4× headroom vs the
        # ~70 s observed in the per-test bisect.
        run: swift test --xunit-output windows-tests.xml
        timeout-minutes: 5
      - name: Show xunit output
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Filter "*tests*.xml" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "=== $($_.Name) ==="
            Get-Content $_.FullName
          }
      - name: Upload xunit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-tests-xml
          path: |
            *tests*.xml
          if-no-files-found: ignore
