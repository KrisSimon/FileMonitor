name: Build and Test

on:
  push:
    branches: [ main, release/*, feature/* ]
  pull_request:
    branches: [ main, release/* ]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Swift 6.2
      run: |
        wget -q https://download.swift.org/swift-6.2-release/xcode/swift-6.2-RELEASE/swift-6.2-RELEASE-osx.pkg
        sudo installer -pkg swift-6.2-RELEASE-osx.pkg -target /
        echo "/Library/Developer/Toolchains/swift-6.2-RELEASE.xctoolchain/usr/bin" >> $GITHUB_PATH
    - name: Build
      run: swift build
    - name: Run tests
      run: swift test

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Swift
        run: |
          wget -q https://download.swift.org/swift-6.2-release/ubuntu2404/swift-6.2-RELEASE/swift-6.2-RELEASE-ubuntu24.04.tar.gz
          tar xzf swift-6.2-RELEASE-ubuntu24.04.tar.gz
          echo "$PWD/swift-6.2-RELEASE-ubuntu24.04/usr/bin" >> $GITHUB_PATH
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v
        timeout-minutes: 10

  build-windows:
    runs-on: windows-latest
    # The "Windows hangs for 10 minutes producing nothing" symptom is
    # actually SPM issue #6592: `swift test` doesn't flush its stdout
    # when running into a pipe, which is what happens under any CI
    # runner. The test binary is running fine — its output is sitting
    # in a fully-buffered pipe until the binary exits, which never
    # happens before the job timeout.
    #
    # Workaround: `--xunit-output` writes test results directly to a
    # file as they happen, bypassing the stdout pipe. The
    # `--parallel` flag is required for the report to be emitted; an
    # SPM quirk noted in the docs for the flag. Per-test serialisation
    # comes from `.serialized` traits on each suite, not from this CLI
    # flag, so `--parallel` is safe here.
    continue-on-error: true   # safety net while we shake out the new flow
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.2"
      - name: Build (includes test compilation)
        run: swift build --build-tests -v
      # Per-test bisect. Earlier runs proved swift-testing on Windows
      # works for `initModule()`; the full suite (and even a suite minus
      # the two top suspects) still hangs. So a hang exists in at least
      # one of the remaining lifecycle tests. Run each test in isolation
      # with a 90-second timeout so we get a definitive name → "which
      # step timed out" tells us the offender.
      - name: List tests (discovery check)
        shell: pwsh
        run: swift test --list-tests
        timeout-minutes: 3

      - name: Test - initModule
        shell: pwsh
        run: swift test --filter "FileMonitorTests/initModule" --parallel
        timeout-minutes: 2
      - name: Test - lifecycleAdd (ExplicitAdd)
        shell: pwsh
        run: swift test --filter "FileMonitorExplicitAddTests/lifecycleAdd" --parallel
        timeout-minutes: 2
      - name: Test - lifecycleChange (ExplicitChange)
        shell: pwsh
        run: swift test --filter "FileMonitorExplicitChangeTests/lifecycleChange" --parallel
        timeout-minutes: 2
      - name: Test - lifecycleDelete (ExplicitDelete)
        shell: pwsh
        run: swift test --filter "FileMonitorExplicitDeleteTests/lifecycleDelete" --parallel
        timeout-minutes: 2
      - name: Test - lifecycleAdd (FileHasPath)
        shell: pwsh
        run: swift test --filter "FileMonitorFileHasPathTests/lifecycleAdd" --parallel
        timeout-minutes: 2
      - name: Test - lifecycleCreate (FileMonitorTests)
        shell: pwsh
        run: swift test --filter "FileMonitorTests/lifecycleCreate" --parallel
        timeout-minutes: 2
      - name: Test - lifecycleChange (FileMonitorTests)
        shell: pwsh
        run: swift test --filter "FileMonitorTests/lifecycleChange" --parallel
        timeout-minutes: 2
      - name: Test - lifecycleDelete (FileMonitorTests)
        shell: pwsh
        run: swift test --filter "FileMonitorTests/lifecycleDelete" --parallel
        timeout-minutes: 2
      - name: Test - lifecycleChangeAsync (FileMonitorTests)
        shell: pwsh
        run: swift test --filter "FileMonitorTests/lifecycleChangeAsync" --parallel
        timeout-minutes: 2
      - name: Test - WindowsWatcher initialization
        shell: pwsh
        run: swift test --filter "WindowsWatcherTests/windowsWatcherInitialization" --parallel
        timeout-minutes: 2
      - name: Test - WindowsWatcher startStop
        shell: pwsh
        run: swift test --filter "WindowsWatcherTests/windowsWatcherStartStop" --parallel
        timeout-minutes: 2
      - name: Test - WindowsWatcher detectsFileCreation
        shell: pwsh
        run: swift test --filter "WindowsWatcherTests/windowsWatcherDetectsFileCreation" --parallel
        timeout-minutes: 2
