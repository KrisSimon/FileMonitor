name: Build and Test

on:
  push:
    branches: [ main, release/*, feature/* ]
  pull_request:
    branches: [ main, release/* ]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Swift 6.2
      run: |
        wget -q https://download.swift.org/swift-6.2-release/xcode/swift-6.2-RELEASE/swift-6.2-RELEASE-osx.pkg
        sudo installer -pkg swift-6.2-RELEASE-osx.pkg -target /
        echo "/Library/Developer/Toolchains/swift-6.2-RELEASE.xctoolchain/usr/bin" >> $GITHUB_PATH
    - name: Build
      run: swift build
    - name: Run tests
      run: swift test

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Swift
        run: |
          wget -q https://download.swift.org/swift-6.2-release/ubuntu2404/swift-6.2-RELEASE/swift-6.2-RELEASE-ubuntu24.04.tar.gz
          tar xzf swift-6.2-RELEASE-ubuntu24.04.tar.gz
          echo "$PWD/swift-6.2-RELEASE-ubuntu24.04/usr/bin" >> $GITHUB_PATH
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v
        timeout-minutes: 10

  build-windows:
    runs-on: windows-latest
    # Windows test run is currently disabled. `swift build` succeeds and the
    # full test suite still compiles, so this job catches compile regressions
    # — but `swift test` hangs the test binary at startup on Swift 6.2 on
    # Windows. Diagnosis:
    #   - Last green Windows job (run #20554666635, 2025-12-28) was at commit
    #     381dea5, the merge of feature/windows-support — when tests still
    #     used XCTest.
    #   - The very next merge (PR #2, ending at 20e90f3) migrated tests to
    #     swift-testing (commit 388a883: "migrate tests to Swift Testing").
    #     Every Windows test run since hangs identically: `Build complete!`
    #     is the last line, then the test binary runs silently for the full
    #     10 minutes (`Terminate orphan process: pid (8120)` confirms it is
    #     alive but emitting nothing) until the job times out.
    #   - Re-pinning the toolchain back to Swift 6.2.0 (the version in use
    #     at the last green run) does not change the symptom, so it is not
    #     a 6.2.x toolchain regression — it is the swift-testing runner on
    #     Windows itself, not the project code.
    # Restore the test step once upstream swift-testing produces output on
    # Windows again.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.2"
      - name: Build (includes test compilation)
        run: swift build --build-tests -v
